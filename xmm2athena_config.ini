# ============================================================
# Configuration file for xmm2athena.py variability module
# ============================================================
# Edit the paths below to match your local environment.
# This file is read at import time by xmm2athena.py.

[paths]
# Path to TopCat/STILTS (directory containing stilts or topcat-full.jar)
topcatpath = /opt/homebrew/bin

# Root of the repository
repodir = /Users/mcoriat/Desktop/XMM-SSC/5XMM/Classification/OM/xmmOMVarClass

# Input directory containing the single source catalogue
# (will be populated after running the single-source pipeline)
inputdir = /Users/mcoriat/Desktop/XMM-SSC/5XMM/Classification/OM/xmmOMVarClass/output/v1/

# Working directory for variability light curve output
workdir = /Users/mcoriat/Desktop/XMM-SSC/5XMM/Classification/OM/xmmOMVarClass/output/var_lc/

[catalogues]
# The single source catalogue input file (relative to inputdir)
# (will be set once Stage 2 single-source catalogue is produced)
inputcat = XMM-OM-SUSS6.1ep_singlerecs_classified.fits

# The raw SUSS file with obs_epoch column (per-observation records).
# Used by make_file_variable() to extract individual observations.
# Can be an absolute path or relative to inputdir.
# (will be set once Stage 1 addEpoch2Source.sh is run)
sussep = /Users/mcoriat/Desktop/XMM-SSC/5XMM/Classification/OM/xmmOMVarClass/XMM-OM-SUSS6.1ep.fits

# Catalogue version number (used for output naming)
catversion = 1

[variability]
# Default filter to process (one of: uvw2, uvm2, uvw1, u, b, v)
band = uvw1

# Minimum chi-squared-reduced for inclusion as variable
chi2_red_min = 5.0

# Select only quality_flag=0 records
onlyqualzero = True

# Minimum distance to nearest source (arcsec) for inclusion
min_srcdist = 6.0

# Minimum number of valid data points for inclusion
minnumber = 8

# Minimum number of peaky observations in an obsid to flag for removal
minpeaks = 2

# Minimum number of points for plotting
minplotpoints = 5

# Make light curve plots during processing
make_plots = False

# Verbosity level (0=quiet, 1=normal, 2=verbose)
chatter = 2

[columns]
# Names of J2000 Epoch 2000 RA/Dec columns
ra2000 = RAJ2000Ep2000
de2000 = DEJ2000Ep2000
