# ============================================================
# Configuration file for single_source processing
# ============================================================
# Edit paths below to match your local environment.
#
[DEFAULT]
#
# ROOT directory — all relative data paths are under this
#
ROOT = /Users/mcoriat/Desktop/XMM-SSC/5XMM/Classification/xmmOMVarClass
#
# TopCat/STILTS — stilts is in PATH at /opt/homebrew/bin/stilts
#
TOPCATPATH = /opt/homebrew/bin
#
# --- SUSS files ---
#
suss_dir     = data/
suss_file    = XMM-OM-SUSS6.1.fits
suss_ep      = XMM-OM-SUSS6.1ep.fits
suss_summary = summary.fits
#
# --- Test files ---
#
test_dir     = output/test
#
# --- Gaia high PM file ---
#
gaia_dr3_highpm = data/gaiadr3_pmgt25.fits
gaiacat         = data/gaiadr3_pmgt25.fits
gaiapath        = output/gaiadr3_PM/
gaiaHP          = output/gaiadr3_healpix.fits
gaiaObsidTable  = ./gaiadr3_obsid_tiles.fits
#
[match2gaia]
# --- match2gaiadr3_positions2Epoch2000.py - step 1a ---
#
work     = ./
#
process_epoch_range = [2005.0,2024.0]
process_epoch_step  = 0.1
catalog             = SUSS
RADIUS              = 0.33334
gaia_temp_cat       = ./gaiadr3_selected_4epoch.fits
obs_cat             = ./epoch_slice_cat.fits
use_healpix = True
chatter     = 0
do_epoch    = True
n_workers   = 1
#
[single_source]
# --- single_source_cat_v2.py ---
#
fix_duplicate = False
#
colsofinterest = ["IAUNAME","obs_epoch","OBSIDS","EPOCHS",'UVW2_ABMAG','UVM2_ABMAG','UVW1_ABMAG','U_ABMAG',"RA_ERR","DEC_ERR","UVW2_NOBS","UVM2_NOBS","UVW1_NOBS","U_NOBS"]
#
iauname = IAUNAME
bands = ['UVW2','UVM2','UVW1','U','B','V']
catalog = SUSS
#
outtable = None
#
# --- Catalogue paths for single_source_cat_v2.py ---
#
rootobs = ./output/
chunk   = sussxgaiadr3_ep2000.fits
sussdir = data/
suss    = XMM-OM-SUSS6.1.fits
#
tmax = 500000000
#
[mergepm]
# --- single_source_cat_mergepm_v2.py - stage 2.2 ---
#
rootobs = ./output/
chunk   = sussxgaiadr3_ep2000_singlerecs.csv
hipm_chunk = sussxgaiadr3_ep2000_singlerecs_hipm.fits
catalog = SUSS
pm_col  = PM
pmRA_col = pmRA
Rpm_limit = 10
chatter = 0
